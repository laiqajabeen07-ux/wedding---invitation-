<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Site check</title>
<style>body{font-family:Georgia,serif;background:#F7F0E7;color:#352B29;max-width:40rem;margin:0 auto;padding:1.2rem 1rem}h1{color:#641C2D;font-weight:400}li{margin:.35rem 0;word-break:break-all}.ok{color:#1d6b2f}.bad{color:#8B1A1A;font-weight:bold}</style></head><body>
<h1>Site check</h1><p>Shows whether every file the invitation needs is present on this website, and whether the invitation functions are running.</p><ul id="out"></ul>
<script>
const files=["assets/couple.webp","assets/couple-alt.webp","assets/logo.webp","assets/favicon.webp","assets/flowers/rose-corner.webp","assets/flowers/rose-white.webp","assets/wedding-nasheed.mp3","assets/og-share.jpg","host/index.html"];
const out=document.getElementById("out");const add=(t,ok)=>{const li=document.createElement("li");li.className=ok?"ok":"bad";li.textContent=(ok?"✓ ":"✗ ")+t;out.appendChild(li)};
(async()=>{for(const f of files){try{const r=await fetch(f,{method:"HEAD",cache:"no-store"});add(f+" ("+r.status+(r.headers.get("content-length")?", "+Math.round(r.headers.get("content-length")/1024)+" KB":"")+")",r.ok)}catch{add(f+" - could not be reached",false)}}
 try{const r=await fetch("/.netlify/functions/get-invite?i=check",{cache:"no-store"});if(r.status===400)add("get-invite function is running (secret is set)",true);else if(r.status===503)add("get-invite function is running but INVITE_SECRET is NOT set",false);else add("get-invite function not found (status "+r.status+") - functions are not deployed",false)}catch{add("functions could not be reached",false)}
 for(const role of ["bride","groom"]){try{const r=await fetch("/.netlify/functions/create-invite",{method:"POST",body:JSON.stringify({role,password:""}),cache:"no-store"});if(r.status===401)add("create-invite running and "+role.toUpperCase()+"_PASSWORD is set",true);else if(r.status===503)add("create-invite is running but "+role.toUpperCase()+"_PASSWORD or INVITE_SECRET is NOT set",false);else add("create-invite function not found (status "+r.status+")",false)}catch{add("create-invite could not be reached",false)}}})();
</script></body></html>
